name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

defaults:
  run:
    shell: bash

jobs:
  # Dependency review covers direct NuGet references and GitHub Actions versions;
  # NuGet audit on restore (build-test) covers transitive packages.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # All three OSes on every event; only the Linux leg is a required check.
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: dotnet --info
        run: dotnet --info

      # NuGet audit uses the live advisory feed, so main can go red without a code change.
      # Moderate (NU1902), high (NU1903) and critical (NU1904) advisories fail the build.
      # NU1900 (the advisory feed could not be fetched) is deliberately left as a warning:
      # failing closed would turn every NuGet outage into a red build, and the next
      # successful run audits again.
      - name: Restore
        run: dotnet restore Dossier.sln -p:NuGetAuditLevel=moderate "-p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904"

      - name: Build
        run: dotnet build Dossier.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution Dossier.sln -c Release --no-build --minimum-expected-tests 330

      # The graph page script runs under a stub DOM against the committed API fixture (Node ships on the runner image).
      - name: Graph page smoke test
        if: runner.os == 'Linux'
        run: node --version && node scripts/graph-smoke.mjs

  aot-smoke:
    name: aot-smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    env:
      RID: ${{ matrix.rid }}
      VERSION: 0.0.0-ci.${{ github.run_number }}
      # Highest glibc symbol version the binaries may require. The runners are Ubuntu 24.04 (glibc 2.39).
      GLIBC_MAX: '2.39'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: dotnet --info
        run: dotnet --info

      # Read-only: records the machine architecture and the native toolchain the runner image provides.
      - name: Linux toolchain preflight
        run: |
          uname -m
          clang --version | sed -n 1p
          objcopy --version | sed -n 1p
          ldd --version | sed -n 1p

      # Same audit gate as build-test; the project (not the solution) is restored for the AOT runtime.
      - name: Restore
        run: dotnet restore src/Dossier/Dossier.csproj -r "$RID" -p:PublishAot=true -p:NuGetAuditLevel=moderate "-p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904"

      # Records which ILCompiler and runtime packs were resolved, so a rolling 10.0.x bump is visible in the log.
      - name: Log resolved AOT toolchain versions
        run: |
          assets=src/Dossier/obj/project.assets.json
          ilc="$(grep -Eo '"(runtime\.[^"/]+\.)?Microsoft\.DotNet\.ILCompiler/[^"]+"' "$assets" | sort -u)"
          if [ -z "$ilc" ]; then
            echo "::error::Microsoft.DotNet.ILCompiler not found in $assets"
            exit 1
          fi
          echo "ILCompiler packages:"
          printf '%s\n' "$ilc"
          echo "runtime packs:"
          grep -E -A1 '"name": "Microsoft\.NETCore\.App\.Runtime(\.NativeAOT)?\.[^"]+"' "$assets" | grep -v '^--' || true

      - name: Publish (Native AOT)
        run: dotnet publish src/Dossier/Dossier.csproj -c Release -r "$RID" -p:PublishAot=true -p:Version="$VERSION" --no-restore -o "out/$RID" 2>&1 | tee publish.log

      - name: Fail on trim and AOT warnings
        run: |
          if grep -E "warning (IL|ILC)[0-9]+" publish.log; then
            echo "::error::Native AOT publish produced IL/ILC warnings"
            exit 1
          fi

      - name: Check glibc baseline (<= ${{ env.GLIBC_MAX }})
        run: |
          shopt -s nullglob
          libs=("out/$RID"/*.so)
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "::error::no native .so found beside the binary in out/$RID"
            exit 1
          fi
          max=$(for f in "out/$RID/Dossier" "${libs[@]}"; do objdump -T "$f"; done | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "max GLIBC symbol version required: ${max:-none}"
          if [ -z "$max" ] || [ "$(printf '%s\n%s\n' "$max" "$GLIBC_MAX" | sort -V | tail -n 1)" != "$GLIBC_MAX" ]; then
            echo "::error::binary requires glibc $max, above the $GLIBC_MAX baseline"
            exit 1
          fi

      - name: Check binary architecture
        run: |
          case "$RID" in
            linux-arm64) want='AArch64' ;;
            linux-x64) want='Advanced Micro Devices X86-64' ;;
            *)
              echo "::error::no expected ELF machine for RID $RID"
              exit 1
              ;;
          esac
          machine="$(readelf -h "out/$RID/Dossier" | sed -n 's/^ *Machine: *//p')"
          echo "ELF machine: ${machine:-none} (expected: $want)"
          if [ "$machine" != "$want" ]; then
            echo "::error::out/$RID/Dossier is '$machine', expected '$want'"
            exit 1
          fi

      - name: Smoke test
        run: scripts/smoke-aot.sh "out/$RID/Dossier" "$VERSION"

  # Proves the .NET tool packages are installable before anything is pushed to nuget.org: the
  # pointer package, this runner's Native AOT RID package and the framework-dependent any
  # fallback are packed into a folder feed, verified, installed with `dotnet tool install` and
  # smoke-tested, then run through `dnx`. Every RID must pass.
  tool-package:
    name: tool-package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-2025
          - rid: osx-arm64
            os: macos-15
    env:
      RID: ${{ matrix.rid }}
      VERSION: 0.0.0-ci.${{ github.run_number }}
      PROJ: src/Dossier/Dossier.csproj
      AUDIT: -p:NuGetAuditLevel=moderate -p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: dotnet --info
        run: dotnet --info

      # The pointer package must be packed with PublishAot=true even though it ships no code:
      # otherwise the SDK tries to pack every RID itself, as non-AOT packages.
      - name: Restore (pointer)
        run: dotnet restore "$PROJ" -p:PublishAot=true $AUDIT

      - name: Pack the pointer package
        run: dotnet pack "$PROJ" -c Release -p:PublishAot=true -p:Version="$VERSION" --no-restore -o feed

      - name: Restore (any fallback)
        run: dotnet restore "$PROJ" -r any -p:PublishAot=false $AUDIT

      - name: Pack the any fallback (framework-dependent)
        run: dotnet pack "$PROJ" -c Release -r any -p:PublishAot=false -p:Version="$VERSION" --no-restore -o feed

      - name: Restore (${{ matrix.rid }})
        run: dotnet restore "$PROJ" -r "$RID" -p:PublishAot=true $AUDIT

      - name: Pack the ${{ matrix.rid }} package (Native AOT)
        run: dotnet pack "$PROJ" -c Release -r "$RID" -p:PublishAot=true -p:Version="$VERSION" --no-restore -o feed 2>&1 | tee pack-tool.log

      - name: Fail on trim and AOT warnings
        run: |
          if grep -E "warning (IL|ILC)[0-9]+" pack-tool.log; then
            echo "::error::Native AOT pack produced IL/ILC warnings"
            exit 1
          fi

      # Package types, versions, the MCP manifest, the command settings and no debug symbols.
      - name: Verify the packages
        run: scripts/verify-tool-packages.sh feed "$VERSION" "$RID"

      # Dossier.Cli resolves only from the local feed; the apphost pack the shim needs may come
      # from nuget.org. See scripts/tool-smoke-nuget.config.
      - name: Write the smoke-test NuGet.config
        shell: bash
        run: |
          feed="$PWD/feed"
          if command -v cygpath >/dev/null 2>&1; then
            feed="$(cygpath -m "$feed")"
          fi
          sed "s#__FEED__#$feed#" scripts/tool-smoke-nuget.config > nuget.smoke.config

      - name: Install from the local feed
        shell: bash
        run: |
          tool="$RUNNER_TEMP/dossier-tool"
          if command -v cygpath >/dev/null 2>&1; then
            tool="$(cygpath -u "$RUNNER_TEMP")/dossier-tool"
          fi
          rm -rf "$tool"
          mkdir -p "$tool"
          dotnet tool install --tool-path "$tool" --configfile nuget.smoke.config --version "$VERSION" Dossier.Cli
          bin="$tool/dossier"
          if [ -f "$tool/dossier.exe" ]; then bin="$tool/dossier.exe"; fi
          got="$("$bin" version)"
          echo "installed tool version: $got"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::installed tool reports '$got', expected '$VERSION'"
            exit 1
          fi
          # The RID package served the install, not the pointer package's placeholder.
          manifest="$tool/.store/dossier.cli/$VERSION/project.assets.ridpackage.json"
          if ! grep -q "dossier.cli.$RID/$VERSION" "$manifest"; then
            echo "::error::install did not select dossier.cli.$RID/$VERSION"
            cat "$manifest"
            exit 1
          fi

      - name: Smoke test the installed tool
        shell: bash
        run: |
          tool="$RUNNER_TEMP/dossier-tool"
          if command -v cygpath >/dev/null 2>&1; then
            tool="$(cygpath -u "$RUNNER_TEMP")/dossier-tool"
          fi
          bin="$tool/dossier"
          if [ -f "$tool/dossier.exe" ]; then bin="$tool/dossier.exe"; fi
          scripts/smoke-aot.sh "$bin" "$VERSION"

      - name: Run the tool through dnx
        shell: bash
        run: |
          out="$(dotnet dnx Dossier.Cli --yes --version "$VERSION" --configfile nuget.smoke.config -- version)"
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qx "$VERSION"; then
            echo "::error::dnx did not report '$VERSION'"
            exit 1
          fi

      # The any package is the fallback a platform outside the four RIDs gets. Installing it
      # directly is the only way to exercise it on a runner that has a RID package.
      - name: Install and run the any fallback
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          tool="$RUNNER_TEMP/dossier-tool-any"
          if command -v cygpath >/dev/null 2>&1; then
            tool="$(cygpath -u "$RUNNER_TEMP")/dossier-tool-any"
          fi
          rm -rf "$tool"
          mkdir -p "$tool"
          dotnet tool install --tool-path "$tool" --configfile nuget.smoke.config --version "$VERSION" Dossier.Cli.any
          "$tool/dossier" version
          grep -q "dossier.cli.any/$VERSION" "$tool/.store/dossier.cli.any/$VERSION/project.assets.json"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Dependabot cannot update a curl pin. To bump gitleaks by hand: take the linux_x64 sha256
      # from the new release's gitleaks_<version>_checksums.txt and update both variables together.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Full history is scanned with gitleaks' default rules (no allowlist).
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v --exit-code 1 .'
