name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds, smoke-tests and uploads the archives as workflow artifacts. Never creates a release.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    # Deleting a v* tag also triggers a push event; there is nothing to build then.
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      # fetch-depth 0 also fetches origin/main; credentials are not persisted, so a later fetch would fail.
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This ancestry check keeps accidental tags off side branches. It is not a control against
      # someone who can already push to main: they can land a commit there and tag it.
      - name: Require the tagged commit to be on main
        if: env.EVENT_NAME == 'push'
        run: |
          git rev-parse --verify --quiet origin/main >/dev/null
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from origin/main"
            exit 1
          fi

      - name: Validate tag and compute version
        id: version
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
              exit 1
            fi
            version="${TAG#v}"
          else
            version="0.0.0-dev.${RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

  build:
    name: build (${{ matrix.rid }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-22.04
            exe: Dossier
            ext: tar.gz
          - rid: win-x64
            os: windows-2025
            exe: Dossier.exe
            ext: zip
          - rid: osx-arm64
            os: macos-15
            exe: Dossier
            ext: tar.gz
    env:
      RID: ${{ matrix.rid }}
      EXE: ${{ matrix.exe }}
      EXT: ${{ matrix.ext }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: dotnet --info
        run: dotnet --info

      # NuGet audit uses the live advisory feed, so a release can fail without a code change.
      # Moderate/high/critical advisories fail; NU1900 (feed unreachable) stays a warning so a
      # NuGet outage does not block a release. The project, not the solution, is restored.
      - name: Restore
        run: dotnet restore src/Dossier/Dossier.csproj -r "$RID" -p:PublishAot=true -p:NuGetAuditLevel=moderate "-p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904"

      # Records which ILCompiler and runtime packs were resolved, so a rolling 10.0.x bump is visible in the log.
      - name: Log resolved AOT toolchain versions
        run: |
          assets=src/Dossier/obj/project.assets.json
          ilc="$(grep -Eo '"(runtime\.[^"/]+\.)?Microsoft\.DotNet\.ILCompiler/[^"]+"' "$assets" | sort -u)"
          if [ -z "$ilc" ]; then
            echo "::error::Microsoft.DotNet.ILCompiler not found in $assets"
            exit 1
          fi
          echo "ILCompiler packages:"
          printf '%s\n' "$ilc"
          echo "runtime packs:"
          grep -E -A1 '"name": "Microsoft\.NETCore\.App\.Runtime(\.NativeAOT)?\.[^"]+"' "$assets" | grep -v '^--' || true

      - name: Publish (Native AOT)
        run: dotnet publish src/Dossier/Dossier.csproj -c Release -r "$RID" -p:PublishAot=true -p:Version="$VERSION" --no-restore -o "out/$RID" 2>&1 | tee publish.log

      - name: Fail on trim and AOT warnings
        run: |
          if grep -E "warning (IL|ILC)[0-9]+" publish.log; then
            echo "::error::Native AOT publish produced IL/ILC warnings"
            exit 1
          fi

      - name: Check glibc baseline (<= 2.35)
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          libs=("out/$RID"/*.so)
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "::error::no native .so found beside the binary in out/$RID"
            exit 1
          fi
          max=$(for f in "out/$RID/$EXE" "${libs[@]}"; do objdump -T "$f"; done | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "max GLIBC symbol version required: ${max:-none}"
          if [ -z "$max" ] || [ "$(printf '%s\n%s\n' "$max" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
            echo "::error::binary requires glibc $max, above the 2.35 baseline"
            exit 1
          fi

      - name: Smoke test
        run: scripts/smoke-aot.sh "out/$RID/$EXE" "$VERSION"

      - name: Package
        run: |
          stage="stage/$RID"
          mkdir -p "$stage" dist
          case "$EXE" in
            *.exe) bin=dossier.exe ;;
            *) bin=dossier ;;
          esac
          cp "out/$RID/$EXE" "$stage/$bin"
          # The native SQLite library must stay beside the binary.
          found=0
          for lib in "out/$RID"/libe_sqlite3.* "out/$RID"/e_sqlite3.*; do
            if [ -f "$lib" ]; then
              cp "$lib" "$stage/"
              found=1
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::native sqlite library not found in out/$RID"
            exit 1
          fi
          cp README.md "$stage/README.md"
          # The MIT license and third-party notices must travel with every binary.
          for doc in LICENSE THIRD-PARTY-NOTICES.md; do
            if [ ! -f "$doc" ]; then
              echo "::error::$doc not found in the repository root"
              exit 1
            fi
            cp "$doc" "$stage/$doc"
          done
          # The .NET runtime is compiled into the binary and carries notices for libraries it links statically.
          # Locate the Native AOT runtime pack that restore resolved (version from project.assets.json).
          assets=src/Dossier/obj/project.assets.json
          pack_version="$(grep -E -A1 '"name": "Microsoft\.NETCore\.App\.Runtime\.NativeAOT\.'"$RID"'"' "$assets" | sed -n 's/.*"version": "\[\([^],]*\).*/\1/p' | head -n 1 || true)"
          if [ -z "$pack_version" ]; then
            echo "::error::Microsoft.NETCore.App.Runtime.NativeAOT.$RID version not found in $assets"
            exit 1
          fi
          packages="${NUGET_PACKAGES:-$HOME/.nuget/packages}"
          if command -v cygpath >/dev/null 2>&1; then
            packages="$(cygpath -u "$packages")"
          fi
          runtime_notices="$packages/microsoft.netcore.app.runtime.nativeaot.$RID/$pack_version/THIRD-PARTY-NOTICES.TXT"
          if [ ! -f "$runtime_notices" ]; then
            echo "::error::.NET runtime third-party notices not found at $runtime_notices"
            exit 1
          fi
          cp "$runtime_notices" "$stage/dotnet-runtime-THIRD-PARTY-NOTICES.TXT"
          archive="dossier-$VERSION-$RID.$EXT"
          if [ "$EXT" = "zip" ]; then
            (cd "$stage" && 7z a -tzip "../../dist/$archive" ./*)
            listing="$(7z l "dist/$archive")"
          else
            # COPYFILE_DISABLE stops macOS bsdtar from adding AppleDouble (._*) entries.
            (cd "$stage" && COPYFILE_DISABLE=1 tar -czf "../../dist/$archive" ./*)
            listing="$(tar -tzvf "dist/$archive")"
          fi
          echo "archive contents:"
          printf '%s\n' "$listing"
          if printf '%s\n' "$listing" | grep -Eq '(^|[[:space:]/])\._'; then
            echo "::error::archive contains AppleDouble (._) entries"
            exit 1
          fi
          ls -l dist

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dossier-${{ matrix.rid }}
          path: dist/dossier-*-${{ matrix.rid }}.*
          retention-days: 7
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # gh release create / edit; the only job that can write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dossier-*
          merge-multiple: true
          path: dist

      - name: Create the release
        working-directory: dist
        run: |
          sha256sum dossier-* > SHA256SUMS
          cat SHA256SUMS
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          # Re-runs are idempotent: a leftover draft is replaced (the tag stays), a published release is never touched.
          rc=0
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/gh-view.err")" || rc=$?
          if [ "$rc" -eq 0 ]; then
            if [ "$state" = "true" ]; then
              echo "replacing leftover draft release $TAG"
              gh release delete "$TAG" --yes
            else
              echo "::error::release $TAG is already published; refusing to modify it"
              exit 1
            fi
          elif grep -qi 'not found' "$RUNNER_TEMP/gh-view.err"; then
            echo "no existing release for $TAG"
          else
            cat "$RUNNER_TEMP/gh-view.err" >&2
            echo "::error::could not look up release $TAG"
            exit 1
          fi
          gh release create "$TAG" "${flags[@]}" dossier-* SHA256SUMS
          gh release edit "$TAG" --draft=false
