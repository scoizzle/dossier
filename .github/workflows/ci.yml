name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Pull requests get the fast Linux leg only; main and manual runs get all three.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15","windows-2025"]') }}
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: dotnet --info
        run: dotnet --info

      # NuGet audit uses the live advisory feed, so main can go red without a code change.
      # Moderate (NU1902), high (NU1903) and critical (NU1904) advisories fail the build.
      # NU1900 (the advisory feed could not be fetched) is deliberately left as a warning:
      # failing closed would turn every NuGet outage into a red build, and the next
      # successful run audits again.
      - name: Restore
        run: dotnet restore Dossier.sln -p:NuGetAuditLevel=moderate "-p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904"

      - name: Build
        run: dotnet build Dossier.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution Dossier.sln -c Release --no-build --minimum-expected-tests 330

      # The graph page script runs under a stub DOM against the committed API fixture (Node ships on the runner image).
      - name: Graph page smoke test
        if: runner.os == 'Linux'
        run: node --version && node scripts/graph-smoke.mjs

  aot-smoke:
    name: aot-smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    env:
      RID: ${{ matrix.rid }}
      VERSION: 0.0.0-ci.${{ github.run_number }}
      # Highest glibc symbol version the binaries may require. The runners are Ubuntu 24.04 (glibc 2.39).
      GLIBC_MAX: '2.39'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: dotnet --info
        run: dotnet --info

      # Read-only: records the machine architecture and the native toolchain the runner image provides.
      - name: Linux toolchain preflight
        run: |
          uname -m
          clang --version | sed -n 1p
          objcopy --version | sed -n 1p
          ldd --version | sed -n 1p

      # Same audit gate as build-test; the project (not the solution) is restored for the AOT runtime.
      - name: Restore
        run: dotnet restore src/Dossier/Dossier.csproj -r "$RID" -p:PublishAot=true -p:NuGetAuditLevel=moderate "-p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904"

      # Records which ILCompiler and runtime packs were resolved, so a rolling 10.0.x bump is visible in the log.
      - name: Log resolved AOT toolchain versions
        run: |
          assets=src/Dossier/obj/project.assets.json
          ilc="$(grep -Eo '"(runtime\.[^"/]+\.)?Microsoft\.DotNet\.ILCompiler/[^"]+"' "$assets" | sort -u)"
          if [ -z "$ilc" ]; then
            echo "::error::Microsoft.DotNet.ILCompiler not found in $assets"
            exit 1
          fi
          echo "ILCompiler packages:"
          printf '%s\n' "$ilc"
          echo "runtime packs:"
          grep -E -A1 '"name": "Microsoft\.NETCore\.App\.Runtime(\.NativeAOT)?\.[^"]+"' "$assets" | grep -v '^--' || true

      - name: Publish (Native AOT)
        run: dotnet publish src/Dossier/Dossier.csproj -c Release -r "$RID" -p:PublishAot=true -p:Version="$VERSION" --no-restore -o "out/$RID" 2>&1 | tee publish.log

      - name: Fail on trim and AOT warnings
        run: |
          if grep -E "warning (IL|ILC)[0-9]+" publish.log; then
            echo "::error::Native AOT publish produced IL/ILC warnings"
            exit 1
          fi

      - name: Check glibc baseline (<= ${{ env.GLIBC_MAX }})
        run: |
          shopt -s nullglob
          libs=("out/$RID"/*.so)
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "::error::no native .so found beside the binary in out/$RID"
            exit 1
          fi
          max=$(for f in "out/$RID/Dossier" "${libs[@]}"; do objdump -T "$f"; done | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "max GLIBC symbol version required: ${max:-none}"
          if [ -z "$max" ] || [ "$(printf '%s\n%s\n' "$max" "$GLIBC_MAX" | sort -V | tail -n 1)" != "$GLIBC_MAX" ]; then
            echo "::error::binary requires glibc $max, above the $GLIBC_MAX baseline"
            exit 1
          fi

      - name: Check binary architecture
        run: |
          case "$RID" in
            linux-arm64) want='AArch64' ;;
            linux-x64) want='Advanced Micro Devices X86-64' ;;
            *)
              echo "::error::no expected ELF machine for RID $RID"
              exit 1
              ;;
          esac
          machine="$(readelf -h "out/$RID/Dossier" | sed -n 's/^ *Machine: *//p')"
          echo "ELF machine: ${machine:-none} (expected: $want)"
          if [ "$machine" != "$want" ]; then
            echo "::error::out/$RID/Dossier is '$machine', expected '$want'"
            exit 1
          fi

      - name: Smoke test
        run: scripts/smoke-aot.sh "out/$RID/Dossier" "$VERSION"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Dependabot cannot update a curl pin. To bump gitleaks by hand: take the linux_x64 sha256
      # from the new release's gitleaks_<version>_checksums.txt and update both variables together.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Full history is scanned with gitleaks' default rules (no allowlist).
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v --exit-code 1 .'
