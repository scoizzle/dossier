<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dossier</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; color: #1a1a1a; }
  header { padding: 10px 16px; background: #222; color: #eee; display: flex; gap: 12px; align-items: center; }
  header a { color: #9cf; text-decoration: none; font-weight: bold; }
  header input { flex: 1; padding: 6px; font-size: 14px; }
  main { padding: 16px; max-width: 960px; margin: 0 auto; }
  h2 { margin-top: 24px; border-bottom: 1px solid #ddd; }
  ul { list-style: none; padding: 0; }
  li { padding: 6px 0; border-bottom: 1px solid #eee; }
  a { color: #05c; cursor: pointer; }
  .id { font-family: ui-monospace, monospace; font-size: 12px; }
  .status { display: inline-block; padding: 0 6px; border-radius: 8px; background: #e8e8e8; font-size: 12px; margin-left: 6px; }
  .note { color: #666; font-size: 12px; }
  pre { background: #f6f6f6; padding: 8px; overflow: auto; }
  .g-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .g-banner { background: #fff4d6; border: 1px solid #f0c36d; padding: 6px 10px; margin-bottom: 8px; }
  .g-status { color: #666; font-size: 12px; min-height: 16px; }
  .g-body { display: flex; gap: 12px; height: 70vh; }
  .g-stage { flex: 1; min-width: 0; background: #0e1116; }
  .g-stage canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  .g-panel { width: 320px; overflow: auto; border: 1px solid #ddd; padding: 8px; }
  .g-panel pre { white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <a href="#/">dossier</a>
  <input id="q" type="search" placeholder="search facts" autofocus>
</header>
<main id="main"></main>
<script src="/graph.js"></script>
<script src="/app.js"></script>
</body>
</html>
